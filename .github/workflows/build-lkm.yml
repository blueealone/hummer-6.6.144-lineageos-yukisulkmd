name: build-lkm
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - name: Deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl bc bison flex libssl-dev libelf-dev lz4 zstd zip unzip lld patch python3 build-essential

      - name: Clang
        run: |
          mkdir -p tc && cd tc
          curl -L --retry 3 -o c.tar.gz "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r522817.tar.gz"
          tar -xzf c.tar.gz && rm -f c.tar.gz
          echo "$(pwd)/bin" >> $GITHUB_PATH
          ./bin/clang --version | head -1

      - name: Get device config
        run: |
          curl -L --retry 3 -o device_config "https://raw.githubusercontent.com/blueealone/hummer-6.6.144-lineageos-yukisulkmsd/main/kernel_config"
          wc -l device_config

      - name: Clone kernel
        run: |
          git clone --depth=1 --branch lineage-23.2 https://github.com/LineageOS/android_kernel_oneplus_sm8750.git KDIR
          cd KDIR
          echo "HEAD: $(git rev-parse HEAD)"
          git config user.email a@b.c && git config user.name a

      - name: Configure + build kernel (for Module.symvers + vmlinux)
        run: |
          cd KDIR
          cp ../device_config .config
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          echo "--- kernelrelease ---"
          make ARCH=arm64 kernelrelease
          echo "--- building vmlinux + modules ---"
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 vmlinux
          make -j$(nproc) ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare || true
          ls -lh vmlinux Module.symvers

      - name: Build YukiSU LKM
        run: |
          git clone --depth=1 https://github.com/Anatdx/YukiSU.git
          cd YukiSU/kernel
          export PATH=$(ls -d ${{ github.workspace }}/tc/bin):$PATH
          make CONFIG_KSU=m CONFIG_KSU_SUPERKEY=y CC=clang KDIR=${{ github.workspace }}/KDIR 2>&1 | tail -40

      - name: Check result
        run: |
          KO=$(find YukiSU/kernel -name 'kernelsu.ko' | head -1)
          echo "KO=$KO"
          if [ -z "$KO" ]; then echo "FAILED: no ko"; exit 1; fi
          ls -lh "$KO"
          echo "=== vermagic ==="
          strings "$KO" | grep -E '^vermagic=|^name=' || true
          echo "=== __versions section size ==="
          readelf -S "$KO" | grep -A1 versions || true
          mkdir -p out
          cp "$KO" out/kernelsu.ko

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-ko
          path: out/kernelsu.ko
          if-no-files-found: error
